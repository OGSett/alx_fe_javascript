<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Quote Generator</title>
</head>
<body>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>
  <h1>Dynamic Quote Generator</h1>
  <div id="syncNotification" style="display:none; background:#d4edda; color:#155724; padding:10px; margin-bottom:10px; border:1px solid #c3e6cb; border-radius:5px;">
    Quotes have been synced.
  </div>
  <div id="quoteDisplay"></div>
  <button id="newQuote">Show New Quote</button>
  <button id="exportQuotesButton">Export Quotes</button>
  <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
  <script src="script.js"></script>
</body>
</html>
